---
- name: Jenkins CI/CD Pipeline for Microservices
  hosts: remote
  become: true

  vars:
    app_dir: "/home/ansible/devops-app"
    backend_repo: "https://github.com/mortymerrrr/backend.git"
    frontend_repo: "https://github.com/mortymerrrr/frontend.git"
    devops_repo: "https://github.com/mortymerrrr/DevOps.git"
    repo_branch: "main"

  tasks:
    # ===== Stage 1: Подготовка окружения =====
    - name: Install prerequisites
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
        state: present
        update_cache: yes
      tags: [prepare]

    - name: Create directory for Docker GPG key
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      tags: [prepare]

    - name: Add Docker GPG key
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | \
          gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg
      tags: [prepare]

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch={{ ansible_architecture | replace('aarch64','arm64') }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
      tags: [prepare]

    - name: Install Docker and Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes
      tags: [prepare]

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: yes
      tags: [prepare]

    - name: Ensure app directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'
      tags: [prepare]

    - name: Clone backend repository
      git:
        repo: "{{ backend_repo }}"
        dest: "{{ app_dir }}/backend"
        version: "{{ repo_branch }}"
        force: yes
      tags: [prepare]

    - name: Clone frontend repository
      git:
        repo: "{{ frontend_repo }}"
        dest: "{{ app_dir }}/frontend"
        version: "{{ repo_branch }}"
        force: yes
      tags: [prepare]

    - name: Clone DevOps repository
      git:
        repo: "{{ devops_repo }}"
        dest: "{{ app_dir }}/DevOps"
        version: "{{ repo_branch }}"
        force: yes
      tags: [prepare]

    - name: Copy docker-compose.yml
      copy:
        src: "{{ app_dir }}/DevOps/docker-compose.yml"
        dest: "{{ app_dir }}/docker-compose.yml"
        remote_src: yes
      tags: [prepare]

    # ===== Stage 2: Запуск приложений =====
    - name: Start microservices
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present
        build: always
      tags: [deploy]
