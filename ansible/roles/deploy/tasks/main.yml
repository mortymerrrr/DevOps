---
# ===== Установка Docker =====
- name: Install prerequisites
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
    state: present
    update_cache: yes
  tags: [install]

- name: Create directory for Docker GPG key
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  tags: [install]

- name: Add Docker GPG key
  shell: |
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | \
      gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg
  tags: [install]

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('aarch64','arm64') }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
  tags: [install]

- name: Install Docker and Compose plugin
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes
  tags: [install]

- name: Ensure Docker service is running and enabled
  service:
    name: docker
    state: started
    enabled: yes
  tags: [install]

- name: Add remote user to docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes
  tags: [install]

# ===== Клонирование репозиториев =====
- name: Ensure app directory exists
  file:
    path: "{{ app_dir }}"
    state: directory
    mode: '0755'
  tags: [clone]

- name: Clone backend repository
  git:
    repo: "{{ backend_repo }}"
    dest: "{{ app_dir }}/backend"
    version: "{{ repo_branch }}"
    force: yes
  tags: [clone]

- name: Clone frontend repository
  git:
    repo: "{{ frontend_repo }}"
    dest: "{{ app_dir }}/frontend"
    version: "{{ repo_branch }}"
    force: yes
  tags: [clone]

- name: Clone DevOps repository
  git:
    repo: "{{ devops_repo }}"
    dest: "{{ app_dir }}/DevOps"
    version: "{{ repo_branch }}"
    force: yes
  tags: [clone]

- name: Copy docker-compose.yml into app_dir
  copy:
    src: "{{ app_dir }}/DevOps/docker-compose.yml"
    dest: "{{ app_dir }}/docker-compose.yml"
    remote_src: yes
  tags: [clone]