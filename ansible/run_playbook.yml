---
- name: Deploy microservices to remote node
  hosts: remote
  become: true

  roles:
    - role: deploy
      tags: [deploy]

  tasks:
    - name: Stop microservices via docker compose
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: absent
      tags: [stop]

    - name: Start microservices via docker compose
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present
        build: always
      tags: [start]